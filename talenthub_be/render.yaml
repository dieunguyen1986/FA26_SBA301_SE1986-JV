services:
  - type: web
    name: talenthub-api
    runtime: docker
    rootDir: talenthub_be
    dockerfilePath: talenthub_be/Dockerfile
    dockerContext: talenthub_be
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: talenthub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talenthub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: talenthub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: talenthub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talenthub-db
          property: password
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: "true"
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: JWT_ISSUER
        value: talenthub-api
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: "None"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: talenthub-db
    plan: free
    databaseName: talenthub
    user: talenthub
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
