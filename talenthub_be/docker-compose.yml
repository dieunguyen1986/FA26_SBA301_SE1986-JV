services:
  postgres:
    image: postgres:16-alpine
    container_name: talenthub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-talenthub}
      POSTGRES_USER: ${DB_USERNAME:-talenthub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    image: talenthub-be:local
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "9090"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-talenthub}
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  postgres-data:
