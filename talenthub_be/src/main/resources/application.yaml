
spring:
  application:
    name: talenthub_be
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:talenthub}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

server:
  shutdown: graceful
  address: 0.0.0.0
  port: ${PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Secret Base64 dùng để ký JWT; không hard-code trong source.
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:talenthub-api}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  auth-cookie:
    # Local HTTP dùng false; production HTTPS nên đặt true.
    secure: ${AUTH_COOKIE_SECURE:false}
    # Lax phù hợp ứng dụng same-site; None yêu cầu HTTPS và CSRF protection.
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    access-name: ${AUTH_COOKIE_ACCESS_NAME:th_access}
    refresh-name: ${AUTH_COOKIE_REFRESH_NAME:th_refresh}
