<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="product.css">
    <title>Product</title>
</head>

<body>
    <div class="container-fluid mt-3">
        <div class="row d-flex justify-content-center align-items-center">
            <div class="col-md-7">
                <h2>Product Information</h2>
                <hr>
                <form id="productForm" action="/add-product" method="POST">
                    <div class="mb-3">
                        <label for="productId" class="form-label">Product ID</label>
                        <input type="text" class="form-control custom-input" id="productId"
                            placeholder="Enter product ID">
                    </div>
                    <div class="mb-3">
                        <label for="productName" class="form-label">Product Name</label>
                        <input type="text" class="form-control custom-input" id="productName"
                            placeholder="Enter product name">
                    </div>
                    <div class="mb-3">
                        <label for="productPrice" class="form-label">Product Price</label>
                        <input type="number" class="form-control custom-input" id="productPrice"
                            placeholder="Enter product price">
                    </div>
                    <button type="submit" class="btn btn-primary">Add New</button>

            </div>
        </div>
    </div>
    <div class="row d-flex justify-content-center align-items-center mt-5">
        <div class="col-md-10">
            <h4>Product List</h4>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th scope="col">Product ID</th>
                        <th scope="col">Product Name</th>
                        <th scope="col">Product Price</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- Product rows will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>
   
    <script src="product.js"></script>
</body>

</html>
